<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>No Skip Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Space+Mono:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --gold-900:#6e431f;
  --gold-700:#a5713a;
  --gold-600:#c08a4f;
  --gold-400:#dda974;
  --gold-300:#eecda0;
  --gold-100:#f8e9d4;
  --navy-950:#041420;
  --navy-900:#062a43;
  --navy-800:#0d3c5c;
  --page-bg:#030d16;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--page-bg);}
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  font-family:'Montserrat',Helvetica,Arial,sans-serif;
}

.post{
  position:relative;
  width:100%;max-width:1080px;aspect-ratio:1/1;
  overflow:hidden;
  border-radius:6px;
  box-shadow:0 40px 100px -30px rgba(0,0,0,0.85);
  background:linear-gradient(165deg, var(--navy-900) 0%, var(--navy-950) 60%, #020a12 100%);
  display:flex;flex-direction:column;
}

.glow{
  position:absolute;top:-10%;right:-15%;
  width:60%;height:40%;
  background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(238,205,160,0.20), transparent 72%);
  z-index:0;pointer-events:none;
}

/* ===== top row ===== */
.top-row{
  position:relative;z-index:5;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:6% 7% 0;
}
.brand-mark img{height:40px;width:auto;display:block;}
.seq-tag{
  font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.08em;
  color:rgba(255,255,255,0.5);
  padding-top:6px;
}
.seq-tag strong{color:var(--gold-300);}

/* ===== headline block ===== */
.headline-block{
  position:relative;z-index:5;
  padding:5% 7% 0;
}
.eyebrow{
  font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--gold-300);margin-bottom:12px;
}
h1{
  font-size:clamp(38px,7.4vw,54px);
  font-weight:900;line-height:1.0;letter-spacing:-0.01em;
  color:#fff;
}
.sub{
  margin-top:14px;
  font-size:15.5px;line-height:1.55;color:rgba(255,255,255,0.68);
  max-width:34ch;
}

/* ===== image card ===== */
.card-wrap{
  position:relative;z-index:5;
  margin:6% 7% 0;
  flex:1;
  min-height:0;
  display:flex;
}
.card{
  position:relative;
  width:100%;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(238,205,160,0.22);
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  background:#0a1420;
}
.card img{
  width:100%;height:100%;object-fit:cover;display:block;
  object-position:var(--pos,50% 50%);
}
.card.contain img{object-fit:contain;background:#fff;}
.card-tag{
  position:absolute;left:12px;bottom:12px;z-index:2;
  font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.05em;
  text-transform:uppercase;color:#fff;
  background:rgba(4,20,32,0.7);padding:6px 12px;border-radius:100px;
  border:1px solid rgba(255,255,255,0.15);
}

/* ===== footer ===== */
.footer{
  position:relative;z-index:5;
  padding:5% 7% 7%;
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;
  border-top:1px solid rgba(255,255,255,0.12);
  margin-top:5%;
}
.stat{display:flex;align-items:baseline;gap:9px;}
.stat .n{font-family:'Bebas Neue';font-size:28px;color:var(--gold-300);line-height:1;}
.stat .l{
  font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:0.04em;text-transform:uppercase;color:rgba(255,255,255,0.55);
  max-width:10ch;line-height:1.25;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 22px;border-radius:100px;
  background:linear-gradient(115deg, var(--gold-700), var(--gold-400) 60%, var(--gold-300));
  color:#fff;font-weight:700;font-size:13.5px;
  box-shadow:0 12px 26px -8px rgba(0,0,0,0.6);
  white-space:nowrap;
}
</style>
</head>
