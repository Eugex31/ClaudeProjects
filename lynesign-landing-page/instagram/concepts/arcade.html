<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advertise At The Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Space+Mono:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --gold-700:#a5713a;
  --gold-600:#c08a4f;
  --gold-400:#dda974;
  --gold-300:#eecda0;
  --gold-100:#f8e9d4;
  --ink-950:#0a0704;
  --page-bg:#030d16;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--page-bg);}
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:28px;
  font-family:'Montserrat',Helvetica,Arial,sans-serif;
}

.post{
  position:relative;
  width:100%;max-width:1080px;aspect-ratio:1/1;
  overflow:hidden;
  border-radius:6px;
  box-shadow:0 40px 100px -30px rgba(0,0,0,0.8);
  background:#041420;
}
.post img.bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:var(--pos,50% 40%);
  z-index:0;
}
/* legibility scrims, navy-tinted */
.post .scrim-bottom{
  position:absolute;left:0;right:0;bottom:0;height:72%;
  background:linear-gradient(0deg, rgba(3,12,20,0.97) 0%, rgba(3,12,20,0.9) 32%, rgba(3,12,20,0.5) 62%, rgba(3,12,20,0.05) 92%, transparent 100%);
  z-index:1;
}
.post .scrim-top{
  position:absolute;left:0;right:0;top:0;height:24%;
  background:linear-gradient(180deg, rgba(3,12,20,0.6) 0%, transparent 100%);
  z-index:1;
}

/* ===== top row ===== */
.brand-mark{
  position:absolute;top:5.5%;left:6.5%;z-index:4;
  background:rgba(3,12,20,0.45);
  padding:10px 14px;
  border-radius:12px;
  backdrop-filter:blur(2px);
}
.brand-mark img{height:72px;width:auto;display:block;filter:drop-shadow(0 3px 10px rgba(0,0,0,0.6));}

.live-tag{
  position:absolute;top:6%;right:6.5%;z-index:4;
  display:flex;align-items:center;gap:7px;
  background:rgba(4,20,32,0.65);
  border:1px solid rgba(255,255,255,0.18);
  padding:8px 15px 8px 12px;
  border-radius:100px;
  font-family:'Space Mono',monospace;
  font-size:13.5px;font-weight:700;letter-spacing:0.06em;
  color:#fff;
  backdrop-filter:blur(3px);
}
.live-tag .dot{
  width:7px;height:7px;border-radius:50%;background:var(--gold-400);
}

/* ===== bottom content block ===== */
.content{
  position:absolute;left:6.5%;right:6.5%;bottom:15.5%;z-index:4;
}
.eyebrow{
  font-family:'Space Mono',monospace;
  font-size:14.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;
  color:var(--gold-300);
  margin-bottom:12px;
}
h1{
  font-size:54px;font-weight:800;line-height:1.08;letter-spacing:-0.02em;
  color:#fff;
  text-wrap:balance;
  margin-bottom:18px;
  max-width:10em;
  text-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.sub{
  font-size:18px;line-height:1.5;color:rgba(255,255,255,0.82);font-weight:500;
  max-width:32ch;margin-bottom:28px;
}
.btn{
  display:inline-flex;align-items:center;gap:11px;
  padding:17px 32px;border-radius:100px;
  background:linear-gradient(115deg, var(--gold-700), var(--gold-400) 60%, var(--gold-300));
  color:#fff;font-weight:700;font-size:19px;
  box-shadow:0 16px 34px -10px rgba(0,0,0,0.6);
}
.btn svg{width:17px;height:17px;flex-shrink:0;}

/* ===== stat chip + url plate, bottom row ===== */
.stat{
  position:absolute;left:6.5%;bottom:5.5%;z-index:4;
  display:flex;align-items:baseline;gap:10px;
  color:#fff;
}
.stat .n{font-family:'Bebas Neue';font-size:38px;color:var(--gold-300);line-height:1;}
.stat .l{
  font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;
  letter-spacing:0.05em;text-transform:uppercase;color:rgba(255,255,255,0.65);
  max-width:11ch;line-height:1.3;
}
.plate{
  position:absolute;right:6.5%;bottom:5.5%;z-index:4;
  display:flex;align-items:center;gap:10px;
  background:rgba(4,20,32,0.6);
  border:1px solid rgba(238,205,160,0.3);
  padding:12px 20px;border-radius:100px;
  backdrop-filter:blur(3px);
}
.plate .sq{width:6px;height:6px;background:var(--gold-400);border-radius:1px;flex-shrink:0;}
.plate span{
  font-family:'Space Mono',monospace;color:var(--gold-100);
  font-size:15.5px;font-weight:700;letter-spacing:0.01em;
}
</style>
</head>
